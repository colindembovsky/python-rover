<!DOCTYPE html>
<!--
THESIS: The maze is a printed board game laid on a dark table. Every state is a physical piece or a printed rules card, never a glowing sci-fi dashboard.
OWN-WORLD: The board is die-cut ochre sand tiles in a dark printed frame with cream coordinates. The pieces are hatched basalt boulders, a cream rover token, a checkered flag on a green base and navy numbered move counters. The controls are card-stock buttons with a pressed edge. States are told apart by stripe pattern, icon shape and words, as well as by colour.
STORY: The class sees where the rover is, what it just tried, and why it stopped. The route reads as numbered counters, so they can count it themselves.
FIRST VIEWPORT: The title and maze tabs sit on top. The status rules card spans the full width. The board fills the left side, and the drive pad and planner sit in the right column.
FORM: Board game, the fourth candidate on the ordered list; staging is a single board with a rules card; seed e60bec64.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mars Rover Mission Control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mars Rover Mission Control</h1>
    <nav class="mazes" aria-label="Choose a maze">
      <span class="mazes-label" id="maze-label">Maze</span>
      <div id="maze-tabs" class="maze-tabs" role="group" aria-labelledby="maze-label"></div>
    </nav>
  </header>

  <section id="status" class="status" data-kind="info" role="status" aria-live="polite">
    <span class="status-icon" id="status-icon" aria-hidden="true"></span>
    <div class="status-text">
      <p class="status-title" id="status-title">Loading the board…</p>
      <p class="status-detail" id="status-detail"></p>
    </div>
  </section>

  <main class="table">
    <div class="board-wrap" id="board-wrap">
      <canvas id="map" aria-label="Map of the Mars maze"></canvas>
      <ul class="key" aria-label="Map key">
        <li><canvas data-key="rover" aria-hidden="true"></canvas>Rover</li>
        <li><canvas data-key="goal" aria-hidden="true"></canvas>Goal</li>
        <li><canvas data-key="rock" aria-hidden="true"></canvas>Rock</li>
        <li class="key-route"><canvas data-key="step" aria-hidden="true"></canvas>Route step</li>
      </ul>
    </div>

    <aside class="panel">
      <section class="drive" aria-label="Drive the rover">
        <h2>Drive</h2>
        <div class="pad">
          <button class="card arrow up" data-direction="up" aria-label="Up" aria-keyshortcuts="ArrowUp">▲</button>
          <button class="card arrow left" data-direction="left" aria-label="Left" aria-keyshortcuts="ArrowLeft">◀</button>
          <button class="card arrow right" data-direction="right" aria-label="Right" aria-keyshortcuts="ArrowRight">▶</button>
          <button class="card arrow down" data-direction="down" aria-label="Down" aria-keyshortcuts="ArrowDown">▼</button>
        </div>
        <p class="hint">or use the arrow keys</p>
        <button id="reset" class="card wide">Back to start</button>
      </section>

      <section class="planner" aria-label="Route planner">
        <h2>Plan</h2>
        <button id="solve" class="card wide primary">Solve</button>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
