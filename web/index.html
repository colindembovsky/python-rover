<!DOCTYPE html>
<!--
THESIS: The maze is an orbital photo of Mars with a planner's grid laid over it, read like a rover driver's traverse map. Not a board game, not a neon sci-fi dashboard.
OWN-WORLD: Procedural butterscotch regolith with wind ripples. Boulders are lit from the west and cast long shadows. A white six-wheeled rover is seen from above. The target is a white crosshair ring. The planned traverse is a yellow line with large numbered waypoints. Chrome is slate telemetry, with GO / NO-GO / FAULT badges that pair a shape with a word.
STORY: The class sees where the rover is, which way it faces, what it tried and why it stopped. Then they count the waypoints themselves.
FIRST VIEWPORT: Title and maze tabs on top. A full-width telemetry status strip. The orbital map on the left, with coordinates on every edge. The drive pad and plan panel in a right rail.
FORM: Brief-pinned orbital traverse map (HiRISE-style); staging is a single map with a telemetry rail; no seed roll.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mars Rover Mission Control</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mars Rover Mission Control</h1>
    <nav class="mazes" aria-label="Choose a maze">
      <span class="mazes-label" id="maze-label">Maze</span>
      <div id="maze-tabs" class="maze-tabs" role="group" aria-labelledby="maze-label"></div>
    </nav>
  </header>

  <section id="status" class="status" data-kind="info" role="status" aria-live="polite">
    <div class="status-badge" aria-hidden="true">
      <span class="status-icon"></span>
      <span class="status-word"></span>
    </div>
    <div class="status-text">
      <p class="status-title" id="status-title">Loading the map…</p>
      <p class="status-detail" id="status-detail"></p>
    </div>
    <dl class="telemetry">
      <div><dt>Position</dt><dd id="tm-position">–</dd></div>
      <div><dt>Moves</dt><dd id="tm-moves">–</dd></div>
    </dl>
  </section>

  <main class="console">
    <div class="board-wrap" id="board-wrap">
      <canvas id="map" aria-label="Orbital map of the Mars maze"></canvas>
      <ul class="key" aria-label="Map key">
        <li><canvas data-key="rover" aria-hidden="true"></canvas>Rover</li>
        <li><canvas data-key="goal" aria-hidden="true"></canvas>Target</li>
        <li><canvas data-key="rock" aria-hidden="true"></canvas>Rock</li>
        <li class="key-route"><canvas data-key="step" aria-hidden="true"></canvas>Waypoint</li>
        <li class="key-scale">1 square = 1 move · up is north</li>
      </ul>
    </div>

    <aside class="panel">
      <section class="drive" aria-label="Drive the rover">
        <h2>Drive</h2>
        <div class="pad">
          <button class="btn arrow up" data-direction="up" aria-label="Up" aria-keyshortcuts="ArrowUp">▲</button>
          <button class="btn arrow left" data-direction="left" aria-label="Left" aria-keyshortcuts="ArrowLeft">◀</button>
          <button class="btn arrow right" data-direction="right" aria-label="Right" aria-keyshortcuts="ArrowRight">▶</button>
          <button class="btn arrow down" data-direction="down" aria-label="Down" aria-keyshortcuts="ArrowDown">▼</button>
        </div>
        <p class="hint">or use the arrow keys</p>
        <button id="reset" class="btn wide">Back to start</button>
      </section>

      <section class="planner" aria-label="Route planner">
        <h2>Plan</h2>
        <button id="solve" class="btn wide primary">Solve</button>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
